s[0].innerHTML=`<div class="eyebrow">THE BIG 5</div><h2>What actually mattered this week.</h2><div class="big5">
<div class="story"><span class="n">1</span><h3>Google made voice a way to get work done.</h3><p>Google introduced Gemini 3.8 Live and Live Extended Thinking on September 15. The models can keep a conversation going while calling tools in the background; Extended Thinking adds deeper reasoning during the exchange. Developer access began through the Gemini API and AI Studio, while enterprise availability includes private previews and forthcoming releases. This is a rollout, not universal access to every integration. [1, 2]</p><div class="why">WHY IT MATTERS → Voice can become an interface for completing a task, not merely asking about it. Your connected tools still determine what can actually happen.</div></div>
<div class="story"><span class="n">2</span><h3>OpenAI took specialized AI deeper into law.</h3><p>On September 17, OpenAI introduced Astra for Law: GPT-6 Astra configured with legal research tools and instructions for professional work. Initial access is for selected firms through Trusted Access in ChatGPT and Codex; API access was announced as coming soon. The launch also included 26 partner-built plugins. This is a professional workflow offering, not a replacement for a lawyer’s judgment. [3, 4]</p><div class="why">WHY IT MATTERS → The business opportunity is expertise plus relevant records plus tools. A general chatbot becomes more useful when it fits a specific job.</div></div>
<div class="story"><span class="n">3</span><h3>Claude is helping build what comes next.</h3><p>Anthropic’s September 17 disclosure says Claude led 26% of its AI research and development work as of August, meaning it could complete most of a task from a high-level prompt under human supervision. More than 90% was at or above its collaboration category. No measured subset was fully autonomous. These are company-reported measurements using a prototype index, not an independently audited industry benchmark. [5, 6]</p><div class="why">WHY IT MATTERS → Delegation is expanding from individual answers to substantial pieces of work. Human direction and review remain part of the result.</div></div>
<div class="story"><span class="n">4</span><h3>A Gemini test crossed into real systems.</h3><p>Reporting this week described Gemini accessing three real companies during a May cybersecurity evaluation run by Irregular. Ars Technica reported that a test-environment misconfiguration allowed internet access; Google said the models stopped when they recognized real infrastructure and affected companies were notified. The incident predates this week’s Live launch. It does not establish that the newly released voice models caused it. [7, 8]</p><div class="why">WHY IT MATTERS → A task instruction is not a technical boundary. Restrict reachable systems and permissions before giving an agent room to act.</div></div>
<div class="story"><span class="n">5</span><h3>Amazon pushed back on an agent shopping for you.</h3><p>GeekWire reported September 20 that Amazon blocked Meta’s Muse from shopping on Amazon.com, citing authorization, transparency and credential concerns. Meta’s published position is that Muse cannot see passwords or payment methods. Those positions should not be collapsed into a proven data-theft claim. The development this week is the access dispute; Muse launched September 8. [9, 10]</p><div class="why">WHY IT MATTERS → Your permission to an agent does not guarantee a platform will allow it. Build around supported integrations and expect access to change.</div></div>
</div>`;
s[1].innerHTML=`<div class="eyebrow">THE INTELLIGENCE BRIEF</div><h2>The shift is from an answer to an outcome.</h2><p>“Write me a follow-up” is useful. “Review the approved meeting notes, prepare the follow-up, identify missing details and put it in my review queue” is a workflow.</p><p><b>Our analysis:</b> this week’s common thread is AI moving closer to the place where work happens: the conversation, the professional toolkit, the research process and the shopping experience. Capability is one part of that transition. Access, context and accountability decide whether it works in practice.</p><p>Business owners do not need to automate everything to benefit. They need one recurring job with a clear starting point, a useful deliverable and someone who can say whether it was done correctly. A model’s confident “done” is not the same as a verified result.</p><div class="quote">The next advantage is knowing what work to hand over—and what good looks like.</div>`;
s[2].innerHTML=`<div class="eyebrow">PUT THIS TO WORK</div><h2>Turn one request into a complete work packet.</h2><p>Try this with a task you already understand: preparing a customer meeting, comparing vendor proposals or organizing a property file. Use approved, non-sensitive material for the first trial.</p><div class="prompt"><b>TRY THIS:</b><br><br>HELP ME COMPLETE ONE RECURRING JOB.<br><br>Job: [DESCRIBE THE WORK]<br>Approved inputs: [ATTACH NOTES OR FILES]<br>Finished result: [SPECIFY THE DELIVERABLE]<br><br>1. Identify the facts and missing information.<br>2. Break the job into steps and complete the steps your available tools support.<br>3. Cite the input behind each important fact. Mark assumptions clearly.<br>4. Put anything requiring my judgment in a short review queue.<br>5. Return the deliverable, checks performed and remaining blockers.<br><br>Do not claim an action happened without evidence. Do not send, purchase, publish, delete or change external records without my explicit approval. If a tool is unavailable, provide the prepared material and state the limitation.</div><p style="margin-top:20px"><b>Judge the whole job.</b> Count preparation, review and correction time. Keep the workflow only if the accepted result is useful and repeatable.</p>`;
s[3].innerHTML=`<div class="eyebrow">MODEL + TOOL RADAR</div><h2>What to try. What to watch.</h2><div class="radar">
<div class="card"><span class="tag">GOOGLE · RELEASED SEPT 15</span><h3>Two voice models, different jobs.</h3><p>Google positions 3.8 Live for scale and efficiency, and Extended Thinking for more complex work. Both support background tool calls. Test conversation quality and actual task completion separately. [1, 2]</p></div>
<div class="card"><span class="tag">OPENAI · RELEASED SEPT 17</span><h3>ChatGPT inside Word.</h3><p>OpenAI made ChatGPT for Word generally available alongside the law announcement, with proofreading, suggested edits and formatting checks. Review changes against your source document before accepting them. [3]</p></div>
<div class="card"><span class="tag">OPENAI · ANNOUNCED SEPT 21</span><h3>Training for the work you do.</h3><p>OpenAI Academy expanded its learning paths for developers, leaders, educators and college students. The focus includes practical workflows, evaluation and directing agents. Training belongs in the adoption budget alongside software. [11]</p></div>
<div class="card"><span class="tag">ANTHROPIC · REPORTED SEPT 17</span><h3>Measure oversight, too.</h3><p>Anthropic proposed tracking how much agent activity is monitored, how quickly it is reviewed and how often it is escalated. Its internal snapshot is company-reported. Our takeaway: measure the review process alongside the output. [5]</p></div>
</div>`;
s[4].innerHTML=`<div class="eyebrow">AI FOR YOUR BUSINESS</div><h2>Start where the handoff is clear.</h2><p>These are workflow ideas to test, not claims that a particular product already handles your business end to end. Choose the one with accessible records and an obvious review standard.</p><div class="steps">
<div class="step"><b>01 · SERVICE BUSINESSES</b><span>Turn approved inquiry notes into a customer brief, missing-information checklist and response draft. You review pricing and promises.</span></div>
<div class="step"><b>02 · REAL ESTATE</b><span>Organize property facts, renovation assumptions and unanswered questions into a deal-review packet. Verify values and costs before an offer.</span></div>
<div class="step"><b>03 · INSURANCE</b><span>Prepare a renewal conversation from approved records. Flag missing details; verify coverage language and recommendations with the responsible professional.</span></div>
<div class="step"><b>04 · CONTENT + MARKETING</b><span>Turn one approved topic into a research brief, outline, shot list and draft captions. Check facts and brand fit before publication.</span></div>
</div><p><b>Buying rule:</b> pay for a demonstrated improvement in your workflow. Compare accepted results, review effort and total cost before expanding access or subscriptions.</p>`;
s[5].innerHTML=`<div class="eyebrow">GET YOUR TIME BACK</div><h2>Stop rebuilding your meeting prep.</h2><p>Before your next customer meeting, give AI the approved notes and relevant documents. Ask for these four blocks in a single page.</p><div class="timegrid">
<div class="timebox"><b>THE CURRENT PICTURE</b>What the customer wants, what has changed and which source supports each fact.</div>
<div class="timebox"><b>THE OPEN QUESTIONS</b>Missing details that could change the recommendation, scope or next step.</div>
<div class="timebox"><b>THE MEETING PLAN</b>A short agenda focused on decisions you need to reach together.</div>
<div class="timebox"><b>THE FOLLOW-UP SHELL</b>A draft with empty spaces for the actual decisions, owners and dates.</div>
</div><p style="margin-top:20px">After the meeting, add the real decisions and review the updated draft. Measure three meetings before claiming time saved. The goal is less repeated preparation, with your judgment still in the loop.</p>`;
s[6].innerHTML=`<div class="eyebrow">INSIDE THE OCG LAB</div><h2>Our focus: make expertise useful in the workflow.</h2><p>We are building around a practical question: where does a business owner lose time between knowing what needs to happen and getting it done?</p><div class="lab-products">
<div class="product"><h3>PLAYBOOK → AI PRO</h3><p>Document a repeatable process. Add guided help with the inputs, preparation and review that make the work easier to complete.</p></div>

</div><p style="margin-top:18px"><b>Our standard:</b> useful work, human judgment and results you can inspect. These are product and design priorities, not a claim that every capability is live.</p>`;
const founder=s[7].querySelector('.founder > div');
founder.innerHTML=`<h2 style="font-size:28px">I didn't get into AI because it was trendy.</h2><p>“I got into it because I had problems I needed to solve.”</p><p>I needed to analyze faster. I needed better information. I needed to manage more moving pieces without adding unnecessary overhead.</p><p>And I needed a way to take ideas that normally required several people, several tools and several days — and move them forward faster.</p><p>That necessity became a larger realization: AI is not really about replacing the person who knows the business. It is about giving that person leverage.</p><p>But leverage without judgment is dangerous. The more capable these systems become, the more important it is that somebody understands the business well enough to tell them what good actually looks like.</p><p><b>That is still our job.</b></p><div class="sig">Genaro Ocasio<br><span style="font-weight:500;color:#687684;font-size:12px">Founder · The OCG Lab</span></div>`;
doc.querySelector('section.footer').innerHTML=`<div class="end">ONE MORE THING.</div><p>This week, choose one recurring job. Define the result, give AI the right inputs and review what comes back. The future of work becomes practical one verified handoff at a time.</p><div style="height:3px;background:linear-gradient(90deg,var(--blue),var(--green));margin:28px 0"></div><div style="font-weight:900">THE LAB REPORT</div><p style="margin-top:6px">You don't need to keep up with AI. We do that for you.<br>Every Tuesday · 9:00 AM CT</p>`;

use-ai-assistant-in-new-standoff-over-agentic-shopping/">GeekWire — Amazon blocks Meta’s Muse AI assistant (September 20).</a></span><br><span id="source-10">[10] <a href="https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/">Meta — Introducing Muse (September 8; background for this week’s access dispute).</a></span><br><span id="source-11">[11] <a href="https://openai.com/index/expanding-openai-academy-with-new-learning-paths/">OpenAI — Expanding OpenAI Academy with new learning paths (September 21).</a></span><br><br>Coverage: September 15–21, 2026. Published September 22, 2026. Earlier events are explicitly dated. Company performance and research measurements are attributed claims, not independent validation. Limited access, previews and forthcoming releases are distinguished from general availability. The Intelligence Brief and practical workflows are OCG Lab editorial analysis. Founder section and photograph preserved from Issue 004. Product mentions are editorial, not paid endorsements.<br><br><a href="../004/">Read Issue 004</a> · <a href="../003/">Read Issue 003</a> · <a href="../002/">Read Issue 002</a> · <a href="../../archive/issue-001.html">Read Issue 001</a></div>`;
