const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');
doc.title='The Lab Report — Issue 007';

doc.querySelector('.hero .issue').textContent='OCTOBER 6, 2026 · ISSUE 007';
doc.querySelector('.hero h1').innerHTML='AI IS LEARNING HOW YOUR BUSINESS WORKS. <span>AND GETTING BIGGER PERMISSIONS.</span>';
doc.querySelector('.hero .dek').textContent='Last week, AI started becoming the operating layer. Now the race is shifting again: the next generation of AI isn\u2019t just getting smarter \u2014 it\u2019s learning how your people, projects, customers, documents, decisions and systems connect. And that changes everything. Including who answers for what it does.';

const s=[...doc.querySelectorAll('section.section')];
s[0].innerHTML=`<div class="eyebrow">THE BIG 5</div><h2>What actually mattered this week.</h2><div class="big5">
<div class="story"><span class="n">1</span><h3>Google moved the free AI line.</h3><p>Starting October 9, personal Gemini accounts without a paid plan lose access to Flash and Pro — free users get Flash-Lite only. Even the cheapest paid tier, AI Plus, loses Pro. Google also added low/medium/high "effort level" toggles and compute-based usage limits. This is a tiering change, not a shutdown: the free product continues, with less capable models. [1, 2]</p><div class="why">WHY IT MATTERS → The free tier of AI is shrinking while paid tiers get more granular. Audit which model each recurring task actually needs before the bill moves.</div></div>
<div class="story"><span class="n">2</span><h3>Meta wired its AI agent into physical hardware.</h3><p>On October 2, Meta released Muse Gadgets: open-source ESP32 firmware and a Linux SDK (Apache 2.0) that let developers connect the Muse assistant to homemade hardware — Raspberry Pi displays, push-to-talk buttons, sensors. Meta also built Muse Home Link, a USB-C hub linking Muse to home networks, and is giving 5,000 free units to US subscribers. The SDK is open; access to the Muse service still requires Meta's pairing and permissions. [3, 4]</p><div class="why">WHY IT MATTERS → Agents are leaving the screen. When AI can touch lights, TVs, and networks, the permission model matters more than the model itself.</div></div>
<div class="story"><span class="n">3</span><h3>OpenAI and Anthropic backed mandatory AI incident reporting.</h3><p>At an Australian parliamentary inquiry on October 6, executives from both companies said they support laws requiring AI developers to disclose data breaches and serious incidents involving AI agents. The inquiry follows an incident in which an OpenAI model accessed non-public sections of Australia's Medicare Statistics Reporting Portal during an internal exercise — discovered in mid-August, reported September 10, criticized as too slow. Nothing has been legislated yet; this is support for a framework, not a law. [5, 6]</p><div class="why">WHY IT MATTERS → Accountability rules are being written for agentic AI now. Expect disclosure expectations to reach your vendors — and eventually your own deployments.</div></div>
<div class="story"><span class="n">4</span><h3>Meta reportedly found critical flaws in Muse before launch.</h3><p>Reporting this week, based on internal documents, says Meta found serious security vulnerabilities in its Muse agent weeks before release — including a Linux virtualization exploit that could have let a user escape Muse's isolated environment and reach Meta's internal systems. Teams patched the issues before launch, and Meta points to testing and its bug bounty program. These are reported pre-launch findings, not a confirmed breach of user data. [7]</p><div class="why">WHY IT MATTERS → Isolation is a design claim until it is tested. Ask every agent vendor the same question: what happens if the sandbox breaks?</div></div>
<div class="story"><span class="n">5</span><h3>Anthropic expanded its founder program.</h3><p>On October 6, Anthropic expanded Claude Startups: approved founders get a year of Claude Team, API credits, and office hours with Anthropic's Applied AI team — plus discounts and credits worth up to $45,000 on tools for sales, design, data engineering and other functions, from companies including Linear, Lovable, ElevenLabs, Granola and Hex. The program accepts applications from startups founded in the last five years or funded in the last two. [8]</p><div class="why">WHY IT MATTERS → If you are building a company, the vendors are competing to subsidize your AI stack. Apply before you pay full price.</div></div>
</div>`;
s[1].innerHTML=`<div class="eyebrow">THE INTELLIGENCE BRIEF</div><h2>Your business needs a memory — and a set of rules.</h2><p>Two ideas collided this week. The big platforms are building context layers that learn how a company actually works — Microsoft's Work IQ, Atlassian's Teamwork Graph: people, projects, decisions and relationships, all connected so AI understands more than the single prompt in front of it.</p><p>At the same time, OpenAI and Anthropic told Australian lawmakers they would accept mandatory reporting when AI agents cause harm — and reporting revealed Meta's own Muse agent nearly escaped its isolated environment before launch through a virtualization flaw.</p><p>Same shift, two halves. AI is moving <b>inside</b> the business. Give it the business's memory but no rules, and you have a liability. Give it rules but no memory, and you have a toy.</p><p><b>Our analysis:</b> the winners will not be the companies with the most AI tools. They will be the ones that connect the business around intelligence — memory plus accountability, context plus permission.</p><div class="quote">Teach the AI how the business works. Then tell it what it is allowed to touch.</div>`;
s[2].innerHTML=`<div class="eyebrow">PUT THIS TO WORK</div><h2>Audit what your AI can touch.</h2><p>You do not need a compliance department. You need one afternoon and a list. Go through every AI tool connected to your business and write down the answers.</p><div class="steps"><div class="step"><b>1. INVENTORY</b><span>List every AI tool with access to your email, calendar, files, CRM, devices, or accounts.</span></div><div class="step"><b>2. PERMISSIONS</b><span>For each one: can it read, write, send, buy, publish, or delete? Write it down.</span></div><div class="step"><b>3. LEAST PRIVILEGE</b><span>Remove anything it does not need. An agent that summarizes email does not need send access.</span></div><div class="step"><b>4. APPROVALS</b><span>Irreversible actions — payments, sending, publishing, deleting — always wait for a human.</span></div><div class="step"><b>5. RECEIPTS</b><span>Keep a log of what each agent did. If you cannot see the history, that is a gap.</span></div></div><div class="prompt"><b>THE RULE</b><br>Read access is cheap. Write access is expensive. Delete access is almost never worth it.</div><p style="margin-top:20px">Do this once, then repeat it every quarter. Permissions drift. Vendors change terms. New tools arrive. The audit is the control.</p>`;
s[3].innerHTML=`<div class="eyebrow">MODEL + TOOL RADAR</div><h2>What to try. What to watch.</h2><div class="radar">
<div class="card"><span class="tag">GOOGLE · EFFECTIVE OCT 9</span><h3>Match the effort to the task.</h3><p>Google's new low/medium/high effort toggles let you choose how much compute a response gets. Test your recurring tasks at each level: if low effort gets the same accepted result, stop paying for high. [1, 2]</p></div>
<div class="card"><span class="tag">ANTHROPIC · EXPANDED OCT 6</span><h3>Founders: claim the subsidy.</h3><p>Claude Startups now reaches more founders with a year of Claude Team, API credits, and up to $45,000 in tool discounts. If you founded in the last five years, check eligibility before buying anything. [8]</p></div>
<div class="card"><span class="tag">META · RELEASED OCT 2</span><h3>Hardware is a hobbyist frontier.</h3><p>Muse Gadgets is genuinely open-source (Apache 2.0) and runs on Raspberry Pi and ESP32 boards — but the assistant behind it is still Meta's service, with Meta's permissions. Open code does not mean open access. [3, 4]</p></div>
<div class="card"><span class="tag">WATCH · SECURITY</span><h3>Ask about the sandbox.</h3><p>Meta's pre-launch Muse findings are a reminder: every agent that acts through an isolated environment can, in principle, escape it. Ask vendors how isolation is tested and what a breach would expose. [7]</p></div>
</div>`;
s[4].innerHTML=`<div class="eyebrow">AI FOR YOUR BUSINESS</div><h2>Stop building random AI tools.</h2><p>A lot of companies are about to make the same mistake they made with software. An AI sales tool. An AI marketing tool. An AI meeting tool. An AI customer service tool. Six months later: another pile of disconnected software. That is not transformation. That is sprawl.</p><p>The better build is one intelligent operating layer:</p><div class="quote">DATA + RELATIONSHIPS + BUSINESS RULES + AI + ACTION</div><p>Understand → Decide → Act → Verify. One layer that knows the business, instead of seven tools that each know a slice of it. That is the system OCG LAB builds.</p><div class="steps">
<div class="step"><b>START WITH ONE WORKFLOW</b><span>Pick the workflow that eats the most coordination time. Connect it end to end before adding a second.</span></div>
<div class="step"><b>DEMAND THE MEMORY</b><span>Any system you buy should remember customers, history, decisions and rules — not ask you to re-explain them every morning.</span></div>
<div class="step"><b>SET THE PERMISSIONS</b><span>Read access is cheap. Write access is expensive. Approval gates on anything irreversible.</span></div>
<div class="step"><b>WATCH THE MONEY</b><span>Capability keeps getting cheaper while free tiers keep shrinking — Google's October 9 move is the template. Take founder subsidies like Claude Startups, and prefer vendors with a real business model.</span></div>
</div><p><b>Buying rule:</b> pay for a demonstrated improvement in your workflow. Compare accepted results, review effort and total cost before expanding access or subscriptions.</p>`;
s[5].innerHTML=`<div class="eyebrow">GET YOUR TIME BACK</div><h2>Stop re-introducing your business to AI.</h2><p>Every time you start a new chat and type "we are a..." you are paying the re-introduction tax. Build one context packet and reuse it.</p><div class="timegrid">
<div class="timebox"><b>WHO WE ARE</b>What the business does, who it serves, and what makes it different — in five sentences.</div>
<div class="timebox"><b>WHAT WE SELL</b>Services or products, plain-English pricing logic, and what you will not do.</div>
<div class="timebox"><b>HOW WE TALK</b>Tone, words to avoid, and the level of formality your customers expect.</div>
<div class="timebox"><b>THE RULES</b>What always needs your approval: pricing, promises, payments, public statements.</div>
<div class="timebox"><b>CURRENT PRIORITIES</b>The two or three things that matter most this quarter.</div>
<div class="timebox"><b>REVIEW MONTHLY</b>One page, updated on the first of the month. Delete what is stale.</div>
</div><div class="prompt" style="margin-top:20px"><b>USE IT</b><br>Paste the packet at the start of any substantial task. Watch how much less correcting you do.</div><p style="margin-top:20px">Context is the cheapest performance upgrade in AI. Most people never write theirs down.</p>`;
s[6].innerHTML=`<div class="eyebrow">INSIDE THE OCG LAB</div><h2>Accountability week, inside the Lab too.</h2><p>This week's theme hit close to home. The Lab's current focus is TED — the founder-facing Technology Super Agent — and the governing question for every design decision is the same one this week's news raises: what should the system be allowed to do, and what should always wait for the founder?</p><div class="lab-products">
<div class="product"><h3>TED · PHASE 2 CAPABILITIES</h3><p>Local capability work continued: a governed live-research path, a tool/action bridge with clean interfaces, and product memory so TED can carry work across sessions. Built and tested locally; not deployed.</p></div>
<div class="product"><h3>TED · THE SIMPLICITY RULE</h3><p>The standing design law, in the founder's words: if he does not need it to talk to TED or resume his work, he does not see it. Capabilities stay underneath; the surface stays a conversation.</p></div>
</div><p style="margin-top:18px"><b>Also this week:</b> the approved OCG LAB brand mark is now locked in for client decks and report headers, and the OCG LAB investor deck was built as an internal working draft.</p><p><b>Our standard:</b> useful work, human judgment and results you can inspect. These are product and design priorities, not a claim that every capability is live.</p>`;
const founder=s[7].querySelector('.founder > div');
founder.innerHTML="<h2 style=\"font-size:28px\">A Day Late. Right on Theme.</h2><p>The Lab Report normally goes out Tuesday. You're reading this on Wednesday. Again.</p><p>But the week's biggest story is exactly about why that lateness is a symptom, not a failure: the more work AI is allowed to do on its own, the more someone has to be accountable for what it does.</p><p>I don't think businesses need more AI tools. Most owners already have enough software. The problem is that none of it understands the whole business. Your CRM knows your customers. Your accounting system knows your money. Your inbox knows your conversations. And somehow you're still the person connecting all of it.</p><p>I don't want another place to type questions. I want a system that understands what I'm building — the projects, the people, the numbers, what's already decided, what needs attention — and helps move the work forward. That's connecting the business around intelligence.</p><p>And there's a second half to it. The more a system understands, the more deliberately you have to decide what it's allowed to do with that understanding. Memory is half the build. Permission is the other half.</p><p><b>So here's my question for you this week: what is your AI allowed to do — and did you actually approve it?</b></p><div class=\"sig\">Genaro Ocasio<br><span style=\"font-weight:500;color:#687684;font-size:12px\">Founder · The OCG Lab</span></div>";
doc.querySelector('section.footer').innerHTML="<div class=\"end\">ONE THING TO REMEMBER</div><div class=\"quote\">PERMISSIONS ARE THE NEW PROMISES.<br><br>WHAT YOUR AI IS ALLOWED TO DO<br>MATTERS MORE THAN WHAT IT CAN DO.</div><p style=\"margin-top:20px\">Give the agent the smallest permission that gets the job done. Keep the rest for yourself.</p><div style=\"height:3px;background:linear-gradient(90deg,var(--blue),var(--green));margin:28px 0\"></div><div style=\"font-weight:900\">THE OCG LAB</div><p style=\"margin-top:6px\">BUILD | AUTOMATE | CREATE | SCALE<br>Next issue: Tuesday morning</p>";
s[8].innerHTML="<div class=\"eyebrow\">SOURCES</div><h2>What this issue was built on.</h2><div class=\"sources\"><span id=\"source-1\">[1] <a href=\"https://www.techrepublic.com/article/news-google-gemini-free-flash-lite-access/\">TechRepublic — Google Limits Free Gemini to Flash-Lite Starting Oct. 9</a></span><br><span id=\"source-2\">[2] <a href=\"https://www.androidpolice.com/google-shrinking-gemini-choices-unless-you-pay-more/\">Android Police — Google is shrinking your Gemini choices unless you pay more</a></span><br><span id=\"source-3\">[3] <a href=\"https://www.storyboard18.com/digital/meta-introduces-muse-gadgets-with-open-source-tools-for-custom-hardware-111881.htm\">Storyboard18 — Meta introduces Muse Gadgets with open-source tools for custom hardware</a></span><br><span id=\"source-4\">[4] <a href=\"https://www.ai-generative.org/news/meta-releases-open-source-sdks-for-diy-muse-ai-devices\">AI-Generative — Meta Releases Open-Source SDKs for DIY Muse AI Devices</a></span><br><span id=\"source-5\">[5] <a href=\"https://www.analyticsinsight.net/news/australia-weighs-new-ai-breach-rules-as-openai-anthropic-show-support\">Analytics Insight — Australia Weighs New AI Breach Rules as OpenAI, Anthropic Show Support</a></span><br><span id=\"source-6\">[6] <a href=\"https://www.mlex.com/mlex/articles/2534294/openai-anthropic-back-mandatory-ai-incident-reporting-in-australia\">MLex — OpenAI, Anthropic back mandatory AI incident reporting in Australia</a></span><br><span id=\"source-7\">[7] <a href=\"https://techgig.com/news/cybersecurity/meta-found-serious-security-flaw-in-muse-ai-before-launch/134752540?utm_source=latest_news&utm_medium=news_dashboard\">TechGig — Meta found serious security flaw in Muse AI before launch</a></span><br><span id=\"source-8\">[8] <a href=\"https://www.pymnts.com/news/artificial-intelligence/2026/anthropic-expands-discounts-support-founders/\">PYMNTS — Anthropic Expands Discounts and Support for Founders</a></span><br><span id=\"source-9\">[9] <a href=\"https://www.coindesk.com/markets/2026/10/06/u-s-china-ai-race-heats-up-as-chinese-rivals-secure-billions-ahead-of-ipos\">CoinDesk — Chinese AI funding surges as US rivals pursue trillion-dollar valuations</a></span><br><br>Published October 6, 2026. Product capabilities are attributed to company announcements and reporting; access and rollout vary. The workflow examples and business implications are OCG LAB editorial analysis.<br><br><a href=\"../006/\">Read Issue 006</a> · <a href=\"../005/\">Read Issue 005</a> · <a href=\"../004/\">Read Issue 004</a> · <a href=\"../003/\">Read Issue 003</a> · <a href=\"../002/\">Read Issue 002</a> · <a href=\"../../archive/issue-001.html\">Read Issue 001</a></div>";
