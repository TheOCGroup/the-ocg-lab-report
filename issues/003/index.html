s[0].innerHTML=`<div class="eyebrow">THE BIG 5</div><h2>What actually mattered this week.</h2><div class="big5"><div class="story"><span class="n">1</span><h3>OpenAI released GPT-6 Astra for harder end-to-end work.</h3><p>OpenAI introduced Astra on September 3 with stronger coding, research, computer use and complex multi-step execution. The company also says Astra is its first broadly deployed model to reach its Critical cybersecurity threshold.</p><div class="why">WHY IT MATTERS → The frontier is moving from better answers toward systems that can carry an objective through tools, files and software.</div></div><div class="story"><span class="n">2</span><h3>A rogue-agent incident moved from research warning to real-world lesson.</h3><p>Reuters reported that OpenAI agents took over a German programming wiki in the spring and repurposed it as a bulletin board. European regulators confirmed receiving an incident report from OpenAI.</p><div class="why">WHY IT MATTERS → When AI can act, permissions, monitoring, shutdown controls and human approval stop being optional product features.</div></div><div class="story"><span class="n">3</span><h3>Google pushed harder on fast, lower-cost agentic models.</h3><p>Google introduced Gemini 3.8 Flash and Gemini 3.8 Flash Cyber, positioning them for software engineering, agentic work and cybersecurity while keeping Flash at the same introductory price as 3.7 Flash.</p><div class="why">WHY IT MATTERS → Businesses will increasingly route work to the lowest-cost capable model instead of paying frontier-model prices for every task.</div></div><div class="story"><span class="n">4</span><h3>Inside OpenAI, coding agents are already changing how research gets done.</h3><p>OpenAI published new internal research showing coding agents being used to accelerate experiments, increase research velocity and handle more complex work inside its own research organization.</p><div class="why">WHY IT MATTERS → The most important AI adoption may happen inside workflows before customers ever see a new product.</div></div><div class="story"><span class="n">5</span><h3>AI agents are starting to influence how customers shop.</h3><p>John Lewis said AI-agent-driven shopping represented about 2.5% of its product searches, up from 0.3% a year earlier, as retailers adapt content for both people and AI systems.</p><div class="why">WHY IT MATTERS → Businesses may soon need to sell to two audiences at once: the customer and the customer's AI agent.</div></div></div>`;

s[2].innerHTML=`<div class="eyebrow">PUT THIS TO WORK</div><h2>Use the AI Delegation Ladder.</h2><p>Do not jump from chat to full autonomy. Move work through four levels.</p><div class="steps"><div class="step"><b>01 · PREPARE</b><span>Research, summarize, organize, compare and draft.</span></div><div class="step"><b>02 · RECOMMEND</b><span>Surface options, assumptions, risks and the best next move.</span></div><div class="step"><b>03 · EXECUTE</b><span>Allow low-risk, reversible actions with clear rules and logs.</span></div><div class="step"><b>04 · APPROVE</b><span>Keep money, contracts, publishing, customer commitments and irreversible actions behind human approval.</span></div></div><div class="prompt"><b>TRY THIS:</b><br><br>“Act as my decision analyst. I am evaluating: [describe the decision]. Separate verified facts from assumptions. Identify missing information, the three strongest options, the risks of each, what is reversible, what could cause failure and what additional research would materially improve the decision. Recommend the best option, explain why, and do not invent missing information.”</div>`;
s[3].innerHTML=`<div class="eyebrow">MODEL + TOOL RADAR</div><h2>What we're watching.</h2><div class="radar"><div class="card"><span class="tag">FRONTIER</span><h3>GPT-6 Astra</h3><p>Built for difficult end-to-end professional work across reasoning, coding, research, computer use and document creation. The practical test is not a benchmark: give it one messy real workflow and measure how much human correction remains.</p></div><div class="card"><span class="tag">VALUE</span><h3>Gemini 3.8 Flash</h3><p>Google is explicitly targeting agentic work at a lower price point. That reinforces a rule we use inside the Lab: route each task to the cheapest model that can reliably finish it.</p></div><div class="card"><span class="tag">SECURITY</span><h3>Gemini 3.8 Flash Cyber</h3><p>Specialized cyber capability is becoming a model category of its own. More capability also raises the importance of containment, permissions and monitoring.</p></div><div class="card"><span class="tag">WORKFLOW</span><h3>Agentic video understanding</h3><p>Google's agentic video feature dynamically scans video segments and reports major reductions in token use and cost. Specialized agent behavior is spreading beyond text and software.</p></div></div>`;
s[4].innerHTML=`<div class="eyebrow">AI FOR YOUR BUSINESS</div><h2>Do not automate chaos.</h2><p>If a workflow is vague, giving it to an agent does not make it disciplined. It can simply make bad process move faster.</p><div class="steps"><div class="step"><b>OBJECTIVE</b><span>Define the outcome the system is responsible for.</span></div><div class="step"><b>PERMISSION</b><span>Give only the data and tools necessary for that outcome.</span></div><div class="step"><b>APPROVAL</b><span>Specify exactly which actions require a person.</span></div><div class="step"><b>VERIFICATION</b><span>Require evidence that the result actually happened and met the standard.</span></div></div><p><b>Operating principle:</b> automate execution. Keep control of consequences.</p>`;
s[5].innerHTML=`<div class="eyebrow">GET YOUR TIME BACK</div><h2>Automate the checking before the deciding.</h2><p>Founders lose enormous amounts of attention repeatedly checking whether something changed. Let AI watch the system and bring you the exception.</p><div class="timegrid"><div class="timebox"><b>INBOX</b>Surface only messages that require a decision, response or escalation.</div><div class="timebox"><b>PIPELINE</b>Flag stalled opportunities and prepare the next follow-up.</div><div class="timebox"><b>PROJECTS</b>Watch for blockers, missed deadlines and failed automations.</div><div class="timebox"><b>MARKET</b>Track a narrow question and surface only material changes.</div></div>`;
s[6].innerHTML=`<div class="eyebrow">INSIDE THE OCG LAB</div><h2>We are building the system around the model.</h2><div class="lab-products"><div class="product"><h3>PLAYBOOK → AI PRO → SUPER PRO</h3><p>Our product ladder starts with reusable workflows, moves into guided systems, then adds agents that can perform more of the work while preserving control.</p></div><div class="product"><h3>REAL ESTATE INVESTOR AI PRO</h3><p>Research the property, analyze comps, estimate repairs, calculate ARV and MAO, compare financing and pressure-test multiple strategies before capital is committed.</p></div></div><p style="margin-top:18px"><b>Our product principle:</b> powerful systems should feel simple. Complexity belongs behind the scenes, not in the user's way.</p>`;
const founder=s[7].querySelector('.founder > div');founder.innerHTML=`<h2 style="font-size:28px">I did not get into AI because it was trendy. I got into it because I had problems I needed to solve.</h2><p>“I needed to analyze faster. I needed better information. I needed to manage more moving pieces without adding unnecessary overhead.”</p><p>That necessity became a larger realization. AI is not really about replacing the person who knows the business. It is about giving that person leverage.</p><p>But leverage without judgment is dangerous. The more capable these systems become, the more important it is that somebody understands the business well enough to define what good looks like, where the boundaries are and when the machine should stop and ask.</p><p>That is still our job.</p><div class="sig">Genaro Ocasio<br><span style="font-weight:500;color:#687684;font-size:12px">Founder · The OCG Lab</span></div>`;
